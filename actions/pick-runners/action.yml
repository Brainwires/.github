name: Pick runners
description: >-
  Our self-hosted pools first, GitHub-hosted for the overflow: each job of the run goes to our pool
  only while it has a free slot (from the fleet's DENEXT_POOL_HEALTH and the queued jobs), else to
  the GitHub image at once. See pick_runners.py for the rules.
inputs:
  jobs:
    description: >-
      The jobs in priority order, whitespace separated: `key=pool`, `key=pool@image`, `key=pool!`
      (pinned to our hardware) or `key=~other` (same runner as `other`); a memory need goes after
      the image and before `!`: `key=pool@image+16g!` (a job its pool cannot hold takes its image). Pools: linux-x64,
      linux-x64-2204, linux-x64-docker, windows-x64, windows-x64-fast (long jobs: the fast host only),
      windows-arm64, macos-arm64, macos-x64, linux-arm64 (the Mac host's Linux arm64 containers;
      overflow ubuntu-24.04-arm, or the job's own @ubuntu-22.04-arm), linux-arm64-desktop.
    required: true
  vars:
    description: "The workflow's `toJSON(vars)` (the RUNNER_* pool variables and DENEXT_POOL_HEALTH)."
    required: true
  token:
    description: "A token with `actions: read` on this repository (its queued and running jobs)."
    default: ${{ github.token }}
  runner-token:
    description: "Optional token that may list the org's self-hosted runners (RUNNER_STATUS_TOKEN)."
    default: ""
  macos-cap:
    description: "The most macOS jobs this run sends to GitHub (GitHub runs ~5 for the whole org)."
    default: "3"
  settle:
    description: "Most seconds to wait for an earlier run of this repository (created up to 2 min before) to finish picking, so its jobs count (0: off)."
    default: "90"
  dry-run:
    description: "`true`: print the decisions, make no API call."
    default: "false"
outputs:
  plan:
    description: '{key: runs-on} as JSON; a job reads `fromJSON(needs.<picker>.outputs.plan).<key>`.'
    value: ${{ steps.pick.outputs.plan }}
  hosted:
    description: "The keys on GitHub's images, as a JSON array."
    value: ${{ steps.pick.outputs.hosted }}
  free:
    description: '{label: free slots} before this run, as JSON (for a planner that allocates itself).'
    value: ${{ steps.pick.outputs.free }}
  blocked:
    description: "Labels that take no job at all (unhealthy, paused, unlisted, stalled), as a JSON array."
    value: ${{ steps.pick.outputs.blocked }}
  saturated:
    description: "GitHub image families (macos, windows, ubuntu) whose queue was saturated, as a JSON array: their jobs waited for our busy pool."
    value: ${{ steps.pick.outputs.saturated }}
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        PICK_JOBS: ${{ inputs.jobs }}
        PICK_VARS: ${{ inputs.vars }}
        PICK_MACOS_CAP: ${{ inputs.macos-cap }}
        PICK_DRY_RUN: ${{ inputs.dry-run }}
        PICK_SETTLE: ${{ inputs.settle }}
        PICK_RUNNER_TOKEN: ${{ inputs.runner-token }}
        GITHUB_TOKEN: ${{ inputs.token }}
      # The script never fails and prints its own fallback; if python itself cannot start, the
      # outputs stay empty and each job's `|| '<image>'` fallback takes GitHub's image.
      run: |
        python3 -I "$GITHUB_ACTION_PATH/pick_runners.py" >>"$GITHUB_OUTPUT" ||
          echo "::warning::pick-runners failed to run: every job takes its fallback image"
